<!doctype html>
<html><head><meta charset="utf-8"><title>Flutter drop renderer</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="../../assets/vendor/three.min.js"></script>
<script>
/* Hero scene: the three pieces of the Flutter mark tumble down from above with a rain of small
   marks (like the falling chicken in the CrispyPop reference), snap together, spin, then burst.
   Transparent background so the page and the cut-out photo sit on top. t goes 0 → 1. */
const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 1280), H = +(q.get("h") || 800);
const MOBILE = H > W;
const T = THREE;
const canvas = document.getElementById("c");
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0, 0);
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.NoToneMapping;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(32, W / H, .1, 200);
camera.position.set(0, 0, 16);

const clamp = (v) => Math.min(1, Math.max(0, v));
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIO = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
function bounce(x) { // lands, overshoots a touch, settles
  if (x >= 1) return 1;
  const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x;
  if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375;
  return n * (x -= 2.625 / d) * x + .984375;
}
// deterministic random so every frame agrees
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* studio environment for glossy reflections */
const env = (() => {
  const s = new T.Scene();
  s.add(new T.Mesh(new T.SphereGeometry(10, 32, 16), new T.MeshBasicMaterial({ color: 0xdfe7f5, side: T.BackSide })));
  const p = (w, h, x, y, z, k, c) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c || 0xffffff })); m.material.color.multiplyScalar(k); m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m); };
  p(8, 2, 0, 6, 3, 6); p(2, 8, -7, 0, 2, 3.5); p(2, 8, 7, 1, 1, 2.5, 0xfff0d8); p(8, 1.5, 0, -6, 2, 1.2);
  const pm = new T.PMREMGenerator(renderer); const tx = pm.fromScene(s, .03).texture; pm.dispose(); return tx;
})();
scene.environment = env;
scene.add(new T.HemisphereLight(0xffffff, 0x334466, .35));
const key = new T.DirectionalLight(0xffffff, 1.5); key.position.set(4, 6, 8); scene.add(key);
const rim = new T.DirectionalLight(0xbfe6ff, 1.4); rim.position.set(-6, 2, -4); scene.add(rim);

/* the Flutter mark, from its SVG geometry (viewBox 166 × 202, y flipped) */
const S = 1 / 100;
const pts = (arr) => arr.map(([x, y]) => new T.Vector2((x - 83) * S, (101 - y) * S));
const PIECES = [
  { p: pts([[9.8, 101], [100.4, 10.4], [156.1, 10.4], [37.7, 128.9]]), c: 0x35B4F4 },
  { p: pts([[100.4, 93.6], [156.1, 93.6], [79.5, 170.3], [51.6, 142.4]]), c: 0x1E88E5 },
  { p: pts([[79.5, 170.7], [107.4, 142.9], [156.2, 191.7], [100.5, 191.7]]), c: 0x0B3D91 }
];
function pieceGeo(p, depth) {
  const sh = new T.Shape(p);
  const g = new T.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: depth * .35, bevelSize: .035, bevelSegments: 4 });
  g.translate(0, 0, -depth / 2);
  return g;
}
function mat(c) { return new T.MeshPhysicalMaterial({ color: c, roughness: .32, metalness: 0, clearcoat: .8, clearcoatRoughness: .12, envMapIntensity: .45 }); }

// big mark
const logo = new T.Group(); scene.add(logo);
const big = PIECES.map((d, i) => {
  const g = pieceGeo(d.p, .32);
  // centre each piece on its own centroid so it can tumble on its own
  g.computeBoundingBox(); const c = new T.Vector3(); g.boundingBox.getCenter(c); g.translate(-c.x, -c.y, 0);
  const m = new T.Mesh(g, mat(d.c)); m.userData.home = c.clone(); m.userData.i = i;
  logo.add(m); return m;
});
const BIG = MOBILE ? 2.2 : 2.6;
logo.scale.setScalar(BIG);
const LX = MOBILE ? 0 : 2.6, LY = MOBILE ? 1.7 : .35;

// rain of small marks
const mini = [];
const miniGeo = PIECES.map((d) => pieceGeo(d.p, .3));
for (let k = 0; k < (MOBILE ? 16 : 22); k++) {
  const g = new T.Group();
  PIECES.forEach((d, i) => g.add(new T.Mesh(miniGeo[i], mat(d.c))));
  const s = .35 + rnd() * .5;
  g.scale.setScalar(s);
  g.userData = {
    x: (rnd() - .5) * (MOBILE ? 9 : 17), z: -4 + rnd() * 6,
    delay: rnd() * .9, speed: .7 + rnd() * .8,
    rx: (rnd() - .5) * 10, ry: (rnd() - .5) * 12, rz: (rnd() - .5) * 8, ph: rnd() * 6
  };
  scene.add(g); mini.push(g);
}

// burst shards at the end
const shards = [];
for (let k = 0; k < 60; k++) {
  const i = k % 3;
  const m = new T.Mesh(miniGeo[i], mat(PIECES[i].c));
  m.scale.setScalar(.15 + rnd() * .25);
  m.userData = { dir: new T.Vector3((rnd() - .5) * 2, (rnd() - .3) * 2, .6 + rnd() * 1.8).normalize(), sp: 6 + rnd() * 10, r: new T.Vector3(rnd() * 9, rnd() * 9, rnd() * 9) };
  m.visible = false; scene.add(m); shards.push(m);
}

const visH = 2 * camera.position.z * Math.tan(T.MathUtils.degToRad(camera.fov / 2));
const TOP = visH / 2 + 3;

function frameAt(t) {
  // ---- big pieces fall one after another and snap into the mark (0 → .34)
  big.forEach((m, i) => {
    const a = .02 + i * .07, b = a + .2;
    const f = seg(t, a, b);
    const fall = bounce(f);
    const h = m.userData.home;
    m.position.set(h.x + (1 - fall) * (i - 1) * .6, h.y + (1 - fall) * (TOP / BIG + 2 - h.y), (1 - easeOut(f)) * (i - 1) * 1.2);
    m.rotation.set((1 - easeOut(f)) * (2.6 + i), (1 - easeOut(f)) * (-3.2 + i * 1.7), (1 - easeOut(f)) * (1.4 - i * 1.1));
  });
  // ---- the assembled mark breathes, then spins once as you scroll (.34 → .78)
  const spin = easeIO(seg(t, .4, .78));
  logo.position.set(LX, LY + Math.sin(t * 18) * .06 * seg(t, .3, .4), 0);
  logo.rotation.set(Math.sin(t * 7) * .06, spin * Math.PI * 2 + Math.sin(t * 9) * .12 * (1 - spin), 0);
  // ---- burst (.8 → 1): mark scales up and breaks into shards flying past the camera
  const burst = seg(t, .8, 1);
  logo.scale.setScalar(BIG * (1 + easeIO(burst) * .25));
  logo.visible = burst < .12;
  shards.forEach((m) => {
    m.visible = burst > 0 && burst < 1;
    const d = easeOut(burst) * m.userData.sp;
    m.position.set(LX + m.userData.dir.x * d, LY + m.userData.dir.y * d, m.userData.dir.z * d);
    m.rotation.set(m.userData.r.x * burst, m.userData.r.y * burst, m.userData.r.z * burst);
  });
  // ---- rain of small marks the whole time (ends after the burst)
  mini.forEach((g) => {
    const u = g.userData;
    const life = (t * u.speed * 2.2 + u.delay) % 1.4;
    const y = TOP - life * (TOP * 2 + 3);
    g.visible = t < .96;
    g.position.set(u.x + Math.sin(u.ph + t * 6) * .3, y, u.z);
    g.rotation.set(u.rx * t + u.ph, u.ry * t, u.rz * t);
  });
  renderer.render(scene, camera);
}

window.ready = Promise.resolve(true);
window.renderFrame = (t, type, quality) => { frameAt(t); return canvas.toDataURL(type || "image/webp", quality || .85); };
frameAt(.5);
</script>
</body></html>
