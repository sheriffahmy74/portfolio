<!doctype html>
<html><head><meta charset="utf-8"><title>Phone frame renderer</title>
<style>
@font-face { font-family: "Archivo"; font-weight: 900; src: url("fonts/archivo-latin-900-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
html, body { margin: 0; background: transparent; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1200" height="1000"></canvas>
<script src="../../assets/vendor/three.min.js"></script>
<script src="phone.js"></script>
<script>
/* Deterministic camera path for the scroll sequence. t goes 0 → 1. */
const W = 1200, H = 1000;
const clamp = (v) => Math.min(1, Math.max(0, v));
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const lerp = (a, b, t) => a + (b - a) * t;

function stateAt(t) {
  // 0.00–0.28  back of the phone turns to the front
  // 0.28–0.40  front, settling
  // 0.40–0.70  turns to a three-quarter view and splits into layers
  // 0.70–0.84  layers hold apart, slow drift
  // 0.84–1.00  layers close up, phone faces the viewer again
  const turn = seg(t, 0, .28), iso = seg(t, .4, .66), drift = seg(t, .7, .84), back = seg(t, .84, 1);
  let ry = lerp(Math.PI + .55, -.18, turn);
  let rx = lerp(.32, .06, turn);
  let rz = lerp(-.12, .02, turn);
  ry = lerp(ry, -1.0, iso); rx = lerp(rx, .3, iso); rz = lerp(rz, .04, iso);
  ry = lerp(ry, -1.12, drift);
  ry = lerp(ry, -.32, back); rx = lerp(rx, .08, back); rz = lerp(rz, 0, back);
  const explode = clamp(seg(t, .46, .7) - back);
  const h = lerp(lerp(660, 720, turn), 620, iso) + (back * 70);
  const x = W / 2 + lerp(0, 40, iso) * (1 - back);
  return { x, y: H / 2 + 10, h, rx, ry, rz, explode, vis: 1 };
}

window.renderReady = (async () => {
  await document.fonts.load('900 40px "Archivo"');
  await document.fonts.load('500 20px "IBM Plex Mono"');
  const phone = Phone3D.create(document.getElementById("c"), { home: "../../assets/img/lamma/home-english.webp" }, { width: W, height: H, preserve: true, exposure: .9 });
  phone.fontsReady();
  phone.setScreen("home");
  await phone.ready("home");
  phone.snap(stateAt(0)); phone.tick(0, 0);
  window.renderFrame = (t, type, q) => {
    phone.snap(stateAt(t));
    phone.tick(0, 0);
    return document.getElementById("c").toDataURL(type || "image/webp", q || .9);
  };
  return true;
})();
</script>
</body></html>
