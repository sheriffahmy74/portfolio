<!doctype html>
<html><head><meta charset="utf-8"><title>Finale renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="../../assets/vendor/three.min.js"></script>
<script>
/* A dreamlike flight for the closing section: a phone floats above a sunset sea of clouds,
   a portal of light opens behind it, and the camera dives into its screen. t goes 0 → 1. */
const W = +(new URLSearchParams(location.search).get("w") || 1280);
const H = +(new URLSearchParams(location.search).get("h") || 720);
const T = THREE;
const canvas = document.getElementById("c");
const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.NoToneMapping;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(42, W / H, .1, 400);

const clamp = (v) => Math.min(1, Math.max(0, v));
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- sky dome ---------- */
const sky = new T.Mesh(new T.SphereGeometry(300, 48, 32), new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP; uniform float uTime;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float y = vP.y;
      vec3 top = vec3(.035,.03,.14);
      vec3 mid = vec3(.26,.12,.42);
      vec3 hor = vec3(1.0,.42,.32);
      vec3 low = vec3(.98,.62,.40);
      vec3 c = mix(hor, mid, smoothstep(.0,.22,y));
      c = mix(c, top, smoothstep(.25,.75,y));
      c = mix(low, c, smoothstep(-.12,.03,y));
      // sun glow toward -z
      float s = max(dot(vP, normalize(vec3(0.,.06,-1.))), 0.);
      c += vec3(1.,.78,.55) * pow(s, 90.) * 1.2 + vec3(1.,.45,.3) * pow(s, 8.) * .3;
      // stars up high
      vec2 g = floor(vP.xz * 260.);
      float st = step(.996, h(g)) * smoothstep(.35,.8,y);
      c += st * .9;
      c += (h(gl_FragCoord.xy + uTime) - .5) / 128.;
      gl_FragColor = vec4(c,1.);
      #include <colorspace_fragment>
    }`
}));
scene.add(sky);

/* ---------- clouds: noise-shaded billboards at many depths ---------- */
const cloudMat = (seed, tint) => new T.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uSeed: { value: seed }, uTint: { value: new T.Color(tint) }, uFade: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; uniform float uSeed; uniform vec3 uTint; uniform float uFade;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)) + uSeed)*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<6;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
    void main(){
      vec2 p = vUv*vec2(3.2,1.6);
      float n = fbm(p + uSeed);
      vec2 c = vUv - .5;
      float shape = 1. - smoothstep(.15,.5, length(c*vec2(1.,2.1)));
      float a = smoothstep(.42,.78, n*shape*1.65) * .92;
      float lit = smoothstep(.3,.9, fbm(p*1.3 + uSeed + vec2(0.,.4)));
      vec3 col = mix(uTint*.42, uTint*1.05 + vec3(.08,.05,.05), lit*.85 + vUv.y*.25);
      gl_FragColor = vec4(col, a*uFade);
      #include <colorspace_fragment>
    }`
});
const clouds = [];
const tints = [0xff9a85, 0xf08fbf, 0xffb48a, 0xa98cf0, 0xffc29a];
for (let i = 0; i < 46; i++) {
  const w = 30 + Math.random() * 46;
  const m = new T.Mesh(new T.PlaneGeometry(w, w * .5), cloudMat(Math.random() * 100, tints[i % tints.length]));
  const side = i % 2 ? 1 : -1;
  m.position.set(side * (6 + Math.random() * 40), -9 - Math.random() * 10, -20 - i * 6.5);
  m.renderOrder = -i;
  scene.add(m); clouds.push(m);
}
// a cloud floor
for (let i = 0; i < 30; i++) {
  const m = new T.Mesh(new T.PlaneGeometry(90, 40), cloudMat(200 + i * 7.3, tints[(i + 2) % tints.length]));
  m.rotation.x = -Math.PI / 2.3;
  m.position.set((Math.random() - .5) * 80, -16 - Math.random() * 3, -10 - i * 9);
  scene.add(m); clouds.push(m);
}

/* ---------- glow sprites + particles ---------- */
function glowTex(inner, outer) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"); const r = g.createRadialGradient(128,128,0,128,128,128);
  r.addColorStop(0, inner); r.addColorStop(.25, inner); r.addColorStop(1, outer);
  g.fillStyle = r; g.fillRect(0,0,256,256);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const sun = new T.Sprite(new T.SpriteMaterial({ map: glowTex("rgba(255,214,170,.85)", "rgba(255,120,80,0)"), blending: T.AdditiveBlending, depthWrite: false }));
sun.scale.set(46, 46, 1); sun.position.set(0, 2, -240); scene.add(sun);

const pCount = 2600;
const pGeo = new T.BufferGeometry();
const pos = new Float32Array(pCount * 3), seeds = new Float32Array(pCount);
for (let i = 0; i < pCount; i++) {
  pos[i*3] = (Math.random()-.5) * 70; pos[i*3+1] = (Math.random()-.4) * 34; pos[i*3+2] = -Math.random() * 240 + 20;
  seeds[i] = Math.random();
}
pGeo.setAttribute("position", new T.BufferAttribute(pos, 3));
pGeo.setAttribute("aSeed", new T.BufferAttribute(seeds, 1));
const pMat = new T.ShaderMaterial({
  transparent: true, depthWrite: false, blending: T.AdditiveBlending,
  uniforms: { uT: { value: 0 }, uWarp: { value: 0 } },
  vertexShader: `attribute float aSeed; uniform float uT; uniform float uWarp; varying float vS;
    void main(){ vS = aSeed; vec3 p = position; p.y += sin(uT*6.283*2. + aSeed*30.)*.4;
      vec4 mv = modelViewMatrix * vec4(p,1.); gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + aSeed*3.5) * (60. / -mv.z) * (1. + uWarp*3.); }`,
  fragmentShader: `varying float vS; void main(){ vec2 c = gl_PointCoord-.5; float d = length(c);
      float a = smoothstep(.5,.0,d); vec3 col = mix(vec3(1.,.85,.6), vec3(.75,.8,1.), vS);
      gl_FragColor = vec4(col*1.2, a*.8); }`
});
const particles = new T.Points(pGeo, pMat); scene.add(particles);

/* ---------- portal ring ---------- */
const portal = new T.Group(); scene.add(portal);
const ring = new T.Mesh(new T.TorusGeometry(5, .06, 16, 160), new T.MeshBasicMaterial({ color: 0xffd9a8, transparent: true }));
const ring2 = new T.Mesh(new T.TorusGeometry(5.6, .03, 16, 160), new T.MeshBasicMaterial({ color: 0xc9b8ff, transparent: true }));
const halo = new T.Sprite(new T.SpriteMaterial({ map: glowTex("rgba(255,240,215,.9)", "rgba(190,150,255,0)"), blending: T.AdditiveBlending, depthWrite: false, transparent: true }));
halo.scale.set(15, 15, 1);
const disc = new T.Mesh(new T.CircleGeometry(5, 96), new T.ShaderMaterial({
  transparent: true, depthWrite: false, blending: T.AdditiveBlending, uniforms: { uT: { value: 0 }, uO: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; uniform float uT; uniform float uO;
    void main(){ vec2 c = vUv-.5; float r = length(c); float a = atan(c.y,c.x);
      float sw = sin(a*6. + r*30. - uT*20.)*.5+.5;
      vec3 col = mix(vec3(.55,.4,1.), vec3(1.,.8,.55), sw) * (1.2 - r*1.6);
      gl_FragColor = vec4(col, uO * smoothstep(.5,.1,r) * (.35 + sw*.4)); }`
}));
portal.add(halo, disc, ring, ring2);
portal.position.set(0, .3, -7);

/* ---------- the phone ---------- */
function rr(w,h,r){ const s=new T.Shape(), x=-w/2, y=-h/2; s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h); s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
function flat(w,h,r){ const g=new T.ShapeGeometry(rr(w,h,r),18), p=g.attributes.position, uv=g.attributes.uv; for(let i=0;i<p.count;i++) uv.setXY(i,(p.getX(i)+w/2)/w,(p.getY(i)+h/2)/h); return g; }
const phone = new T.Group(); scene.add(phone);
const PW = 1, PH = 2.12, D = .1;
const env = new T.PMREMGenerator(renderer).fromScene((() => { const s = new T.Scene(); s.add(new T.Mesh(new T.SphereGeometry(10,32,16), new T.MeshBasicMaterial({ color: 0xffb999, side: T.BackSide }))); const l = new T.Mesh(new T.PlaneGeometry(8,3), new T.MeshBasicMaterial({ color: 0xffffff })); l.material.color.multiplyScalar(5); l.position.set(0,5,-2); l.lookAt(0,0,0); s.add(l); const b = new T.Mesh(new T.PlaneGeometry(3,8), new T.MeshBasicMaterial({ color: 0xc8b6ff })); b.material.color.multiplyScalar(3); b.position.set(-6,0,2); b.lookAt(0,0,0); s.add(b); return s; })(), .04).texture;
const bevel = .022;
const frameGeo = new T.ExtrudeGeometry(rr(PW-bevel*2, PH-bevel*2, .17-bevel), { depth: D-bevel*2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 20 });
frameGeo.center();
const metal = new T.MeshStandardMaterial({ color: 0xd8d2e6, metalness: 1, roughness: .22, envMap: env });
phone.add(new T.Mesh(frameGeo, metal));
const back = new T.Mesh(flat(PW-.05, PH-.05, .15), new T.MeshPhysicalMaterial({ color: 0x2F5BEA, roughness: .3, clearcoat: 1, envMap: env }));
back.position.z = -D/2-.002; back.rotation.y = Math.PI; phone.add(back);
const bezel = new T.Mesh(flat(PW-.03, PH-.03, .155), new T.MeshPhysicalMaterial({ color: 0x050608, roughness: .1, clearcoat: 1, envMap: env }));
bezel.position.z = D/2+.002; phone.add(bezel);
const screenMat = new T.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const screen = new T.Mesh(flat(.912, 2.026, .13), screenMat); screen.position.z = D/2+.004; phone.add(screen);
const island = new T.Mesh(flat(.27,.078,.039), new T.MeshBasicMaterial({ color: 0 })); island.position.set(0, 2.026/2-.085, D/2+.007); phone.add(island);
const glow = new T.Mesh(flat(.912, 2.026, .13), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, toneMapped: false }));
glow.position.z = D/2+.008; phone.add(glow);
scene.add(new T.HemisphereLight(0xffe2d0, 0x5040a0, 1.1));
const key = new T.DirectionalLight(0xffd2b0, 2.2); key.position.set(-3, 3, -6); scene.add(key);
const fill = new T.DirectionalLight(0xc0b0ff, 1.2); fill.position.set(4, 1, 5); scene.add(fill);

/* ---------- timeline ---------- */
function frameAt(t) {
  const fly = t;                         // camera keeps gliding forward through the clouds
  const portalIn = seg(t, .38, .58);
  const dive = seg(t, .72, 1);
  camera.position.set(Math.sin(t * 3.1) * .6 * (1 - dive), lerp(1.2, .3, seg(t, 0, .5)) * (1 - dive) + .3 * dive, lerp(9, 6.2, seg(t, 0, .6)));
  camera.lookAt(0, .3, -4);
  // clouds stream toward the camera
  clouds.forEach((c, i) => { c.position.z = ((-20 - (i % 46) * 6.5 + fly * 160) % 300 + 300) % 300 - 290; c.material.uniforms.uFade.value = 1 - dive * .9; });
  particles.position.z = fly * 60; pMat.uniforms.uT.value = t; pMat.uniforms.uWarp.value = dive;
  // phone floats, turns, then faces the camera for the dive
  const spin = lerp(-2.6, -.25, seg(t, 0, .4));
  phone.rotation.set(lerp(.25, 0, seg(t, .55, .8)) + Math.sin(t * 9) * .03 * (1 - dive), lerp(spin, 0, seg(t, .5, .75)), lerp(-.12, 0, seg(t, .5, .75)));
  phone.position.set(0, .3 + Math.sin(t * 8) * .08 * (1 - dive), lerp(-1.5, 0, seg(t, 0, .45)));
  phone.scale.setScalar(lerp(1.15, 1.35, seg(t, .3, .7)));
  // portal opens behind the phone
  portal.scale.setScalar(lerp(.01, 1, portalIn) * lerp(1, 2.2, dive));
  portal.rotation.z = t * 2.2;
  ring.material.opacity = portalIn; ring2.material.opacity = portalIn * .8;
  halo.material.opacity = portalIn * .45;
  disc.material.uniforms.uO.value = portalIn; disc.material.uniforms.uT.value = t;
  ring2.rotation.x = Math.sin(t * 5) * .3;
  // dive into the screen: camera rushes in, screen blooms to white
  camera.position.z = lerp(camera.position.z, 2.3, dive);
  camera.position.x = lerp(camera.position.x, 0, dive);
  camera.lookAt(0, lerp(.3, .3, dive), lerp(-4, 0, dive));
  camera.fov = lerp(42, 30, dive); camera.updateProjectionMatrix();
  renderer.render(scene, camera);
}

window.ready = new Promise((res) => {
  new T.TextureLoader().load("../../assets/img/lamma/home-english.webp", (tex) => {
    tex.colorSpace = T.SRGBColorSpace; screenMat.map = tex; screenMat.needsUpdate = true;
    frameAt(0); res(true);
  });
});
window.renderFrame = (t, type, q) => { frameAt(t); return canvas.toDataURL(type || "image/jpeg", q || .86); };
</script>
</body></html>
